<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ExpGym and PoolAct: exploration under a feedback budget</title>
  <desc id="desc">Agents choose tool calls. Tuning, search, and audit environments return observations that consume simulated feedback time. Traces record scores, costs, and decisions. PoolAct coordinates multiple agents with a shared cache, exploration graph, and decision lock.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="20" fill="#f5f7fb"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="40" y="44" font-size="15" font-weight="700" fill="#4f46e5" letter-spacing="2">EXPGYM + POOLACT</text>
    <text x="40" y="83" font-size="29" font-weight="700" fill="#0f172a">Every observation has a cost. Make it count.</text>
    <rect x="40" y="116" width="248" height="175" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="60" y="150" font-size="13" font-weight="700" fill="#64748b">01 / CHOOSE</text>
    <text x="60" y="180" font-size="23" font-weight="700" fill="#0f172a">Agent decisions</text>
    <text x="60" y="209" font-size="16" fill="#475569">One agent or an agent pool</text>
    <rect x="60" y="233" width="45" height="35" rx="8" fill="#ede9fe"/>
    <rect x="115" y="233" width="45" height="35" rx="8" fill="#ede9fe"/>
    <rect x="170" y="233" width="45" height="35" rx="8" fill="#ede9fe"/>
    <text x="82" y="256" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">A1</text>
    <text x="137" y="256" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">A2</text>
    <text x="192" y="256" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">An</text>
    <path d="M 291 184 H 369" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="331" y="173" text-anchor="middle" font-size="12" fill="#475569">tool call</text>
    <path d="M 372 245 H 294" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="333" y="267" text-anchor="middle" font-size="12" fill="#475569">feedback</text>
    <rect x="376" y="116" width="428" height="175" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="398" y="150" font-size="13" font-weight="700" fill="#64748b">02 / SPEND THE FEEDBACK BUDGET</text>
    <text x="398" y="180" font-size="23" font-weight="700" fill="#0f172a">Tuning · Search · Audit</text>
    <text x="398" y="209" font-size="16" fill="#475569">Repeatable observations, simulated costs</text>
    <rect x="398" y="237" width="103" height="29" rx="7" fill="#e0f2fe"/>
    <rect x="511" y="237" width="128" height="29" rx="7" fill="#e0e7ff"/>
    <rect x="649" y="237" width="130" height="29" rx="7" fill="#fef3c7"/>
    <text x="449" y="257" text-anchor="middle" font-size="13" font-weight="600" fill="#075985">Free / ∞</text>
    <text x="575" y="257" text-anchor="middle" font-size="13" font-weight="600" fill="#3730a3">Moderate / 10×</text>
    <text x="714" y="257" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Tight / 3×</text>
    <path d="M 807 207 H 872" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="880" y="116" width="280" height="175" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="902" y="150" font-size="13" font-weight="700" fill="#64748b">03 / EVALUATE</text>
    <text x="902" y="180" font-size="23" font-weight="700" fill="#0f172a">Quality + cost</text>
    <text x="902" y="211" font-size="16" fill="#475569">Task scores and feedback spent</text>
    <text x="902" y="238" font-size="16" fill="#475569">Complete JSON trajectories</text>
    <text x="902" y="265" font-size="16" fill="#475569">Single-agent and pool reports</text>
    <rect x="40" y="318" width="1120" height="69" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="60" y="360" font-size="20" font-weight="700" fill="#3730a3">PoolAct</text>
    <text x="168" y="360" font-size="16" fill="#4338ca">Shared observations</text>
    <text x="343" y="360" font-size="18" fill="#818cf8">+</text>
    <text x="372" y="360" font-size="16" fill="#4338ca">Exploration graph</text>
    <text x="525" y="360" font-size="18" fill="#818cf8">+</text>
    <text x="554" y="360" font-size="16" fill="#4338ca">Decision lock</text>
    <path d="M 679 354 H 733" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="752" y="360" font-size="16" font-weight="600" fill="#3730a3">Coordinate exploration across agents</text>
  </g>
</svg>
